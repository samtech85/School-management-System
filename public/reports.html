<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports & Summaries - School Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-50">
  <div id="app" class="flex min-h-screen">
    <div class="flex-1 p-6 space-y-6">
      <h3 class="text-xl font-bold text-heading">Financial & Academic Reports (HTG)</h3>

      <!-- Financial Metrics Grid -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-primary">
          <p class="text-xs text-gray-500 uppercase font-medium">Total Collected</p>
          <p id="metric-collected" class="text-xl font-bold text-heading mt-1">HTG 0.00</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-secondary">
          <p class="text-xs text-gray-500 uppercase font-medium">Expected Revenue</p>
          <p id="metric-expected" class="text-xl font-bold text-heading mt-1">HTG 0.00</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-yellow-500">
          <p class="text-xs text-gray-500 uppercase font-medium">Outstanding Balance</p>
          <p id="metric-outstanding" class="text-xl font-bold text-heading mt-1">HTG 0.00</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-purple-500">
          <p class="text-xs text-gray-500 uppercase font-medium">Total Scholarships</p>
          <p id="metric-scholarships" class="text-xl font-bold text-heading mt-1">0</p>
        </div>
      </div>

      <!-- Tables Section -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 pt-4">
        <!-- Term Revenue Table -->
        <div class="bg-white p-5 rounded-lg shadow-sm space-y-3">
          <h4 class="font-bold text-heading text-base">Revenue by Term</h4>
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-gray-100 text-darkgray uppercase text-xs border-b">
                <th class="p-2.5">Term Name</th>
                <th class="p-2.5">Enrollments</th>
                <th class="p-2.5 text-right">Collected (HTG)</th>
              </tr>
            </thead>
            <tbody id="term-revenue-body" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>

        <!-- Academic Class Summary -->
        <div class="bg-white p-5 rounded-lg shadow-sm space-y-3">
          <h4 class="font-bold text-heading text-base">Class Enrollment Summary</h4>
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-gray-100 text-darkgray uppercase text-xs border-b">
                <th class="p-2.5">Course Code</th>
                <th class="p-2.5">Class Name</th>
                <th class="p-2.5 text-right">Students Enrolled</th>
              </tr>
            </thead>
            <tbody id="academic-summary-body" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
