<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - School Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-heading">School Management System</h1>
      <p class="text-sm text-gray-500">Currency: HTG (Haitian Gourde)</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-darkgray mb-1">Username</label>
        <input type="text" id="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
      </div>
      <div>
        <label class="block text-sm font-medium text-darkgray mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
      </div>
      <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-primary-dark transition">Login</button>
    </form>
    <div class="mt-4 text-center text-sm">
      <p class="text-gray-600">Don't have an account? <a href="register.html" class="text-secondary font-medium hover:underline">Sign up</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const res = await apiRequest('/auth/login', 'POST', { username, password });
        localStorage.setItem('sms_token', res.token);
        localStorage.setItem('sms_user', JSON.stringify(res.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message || 'Login failed');
      }
    });
  </script>
</body>
</html>
