<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | School Management</title>
  <link href="/css/output.css" rel="stylesheet">
</head>
<body class="min-h-screen grid place-items-center p-6">
  <main class="w-full max-w-md rounded-xl bg-white p-8 shadow">
    <h1 class="text-2xl font-bold">School Management System</h1>
    <p class="mt-2 text-slate-600">Sign in to continue.</p>
    <form id="login-form" class="mt-6 space-y-4">
      <label class="block">Email<input class="mt-1 w-full rounded border p-2" name="email" type="email" required></label>
      <label class="block">Password<input class="mt-1 w-full rounded border p-2" name="password" type="password" required></label>
      <p class="text-sm text-red-700" data-message role="alert"></p>
      <button class="w-full rounded bg-blue-700 p-2 text-white" type="submit">Sign in</button>
    </form>
    <p class="mt-4 text-sm">New student? <a class="text-blue-700 underline" href="/register.html">Create an account</a></p>
  </main>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body>
</html>
