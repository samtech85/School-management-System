<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academics - Terms, Courses & Classes</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-50">
  <div id="app" class="flex min-h-screen">
    <div class="flex-1 p-6 space-y-8">
      <h3 class="text-xl font-bold text-heading">Terms, Courses & Classes Management</h3>

      <!-- Grid Sections -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Terms Section -->
        <div class="bg-white p-5 rounded-lg shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-heading text-lg">Terms / Sessions</h4>
            <button onclick="openTermModal()" class="bg-primary text-white px-3 py-1.5 rounded text-xs hover:bg-primary-dark">+ Add Term</button>
          </div>
          <div id="terms-list" class="space-y-3"></div>
        </div>

        <!-- Courses Section -->
        <div class="bg-white p-5 rounded-lg shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-heading text-lg">Courses</h4>
            <button onclick="openCourseModal()" class="bg-primary text-white px-3 py-1.5 rounded text-xs hover:bg-primary-dark">+ Add Course</button>
          </div>
          <div id="courses-list" class="space-y-3"></div>
        </div>

        <!-- Classes Section -->
        <div class="bg-white p-5 rounded-lg shadow-sm space-y-4 lg:col-span-1">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-heading text-lg">Classes</h4>
            <button onclick="openClassModal()" class="bg-primary text-white px-3 py-1.5 rounded text-xs hover:bg-primary-dark">+ Add Class</button>
          </div>
          <div id="classes-list" class="space-y-3"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="term-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg w-full max-w-sm space-y-4">
      <h3 class="font-bold text-lg">Create Term</h3>
      <form id="term-form" class="space-y-3">
        <input type="text" id="term-name" placeholder="Term Name (e.g. Fall 2026)" required class="w-full px-3 py-2 border rounded text-sm">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Start Date</label>
          <input type="date" id="term-start" required class="w-full px-3 py-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">End Date</label>
          <input type="date" id="term-end" required class="w-full px-3 py-2 border rounded text-sm">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeModals()" class="px-3 py-1.5 bg-gray-200 rounded text-sm">Cancel</button>
          <button type="submit" class="px-3 py-1.5 bg-primary text-white rounded text-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="course-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg w-full max-w-sm space-y-4">
      <h3 class="font-bold text-lg">Create Course</h3>
      <form id="course-form" class="space-y-3">
        <input type="text" id="course-code" placeholder="Code (e.g. MATH101)" required class="w-full px-3 py-2 border rounded text-sm">
        <input type="text" id="course-name" placeholder="Course Name" required class="w-full px-3 py-2 border rounded text-sm">
        <textarea id="course-desc" placeholder="Description (optional)" class="w-full px-3 py-2 border rounded text-sm"></textarea>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeModals()" class="px-3 py-1.5 bg-gray-200 rounded text-sm">Cancel</button>
          <button type="submit" class="px-3 py-1.5 bg-primary text-white rounded text-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="class-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg w-full max-w-sm space-y-4">
      <h3 class="font-bold text-lg">Create Class</h3>
      <form id="class-form" class="space-y-3">
        <input type="text" id="class-name" placeholder="Class Name (e.g. Section A)" required class="w-full px-3 py-2 border rounded text-sm">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Course</label>
          <select id="class-course" required class="w-full px-3 py-2 border rounded text-sm"></select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Term</label>
          <select id="class-term" required class="w-full px-3 py-2 border rounded text-sm"></select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Assigned Teacher</label>
          <select id="class-teacher" class="w-full px-3 py-2 border rounded text-sm"></select>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeModals()" class="px-3 py-1.5 bg-gray-200 rounded text-sm">Cancel</button>
          <button type="submit" class="px-3 py-1.5 bg-primary text-white rounded text-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/academics.js"></script>
</body>
</html>
