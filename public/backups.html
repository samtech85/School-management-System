<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup & Restore - School Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-50">
  <div id="app" class="flex min-h-screen">
    <div class="flex-1 p-6 space-y-6">
      <h3 class="text-xl font-bold text-heading">System Backup & Data Export</h3>

      <div class="bg-white p-6 rounded-lg shadow-sm max-w-xl space-y-4">
        <p class="text-sm text-gray-600">
          Generate and download a complete JSON snapshot of all system data including users, terms, courses, classes, enrollments, fee records, and grades.
        </p>
        <button id="download-backup-btn" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-primary-dark transition">Download Full JSON Backup</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/backups.js"></script>
</body>
</html>
