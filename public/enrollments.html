<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollments & Fees - School Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-50">
  <div id="app" class="flex min-h-screen">
    <div class="flex-1 p-6 space-y-6">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-bold text-heading">Enrollments & Fee Management (HTG)</h3>
        <button onclick="openEnrollModal()" class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:bg-primary-dark transition">+ Enroll Student</button>
      </div>

      <!-- Enrollments Table -->
      <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-darkgray uppercase text-xs tracking-wider border-b">
              <th class="p-3">Student</th>
              <th class="p-3">Class / Course</th>
              <th class="p-3">Term</th>
              <th class="p-3">Fee (HTG)</th>
              <th class="p-3">Paid (HTG)</th>
              <th class="p-3">Scholarship</th>
              <th class="p-3">Receipt ID</th>
              <th class="p-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="enrollments-table-body" class="divide-y divide-gray-200 text-sm"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Enroll Modal -->
  <div id="enroll-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md space-y-4">
      <h3 class="font-bold text-lg">Enroll Student in Class</h3>
      <form id="enroll-form" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-darkgray mb-1">Student</label>
          <select id="enroll-student" required class="w-full px-3 py-2 border rounded text-sm"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-darkgray mb-1">Class</label>
          <select id="enroll-class" required class="w-full px-3 py-2 border rounded text-sm"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-darkgray mb-1">Fee (HTG)</label>
          <input type="number" step="0.01" id="enroll-fee" value="12500.00" required class="w-full px-3 py-2 border rounded text-sm">
        </div>
        <div class="flex items-center space-x-2">
          <input type="checkbox" id="enroll-scholarship" class="rounded">
          <label class="text-sm font-medium text-darkgray">Scholarship Option (Fee waived)</label>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeEnrollModal()" class="px-4 py-2 bg-gray-200 rounded text-sm">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-primary text-white rounded text-sm">Enroll</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/enrollments.js"></script>
</body>
</html>
