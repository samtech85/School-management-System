<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - School Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-heading">Create Account</h1>
      <p class="text-sm text-gray-500">New accounts require Admin approval</p>
    </div>
    <form id="register-form" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-darkgray mb-1">First Name</label>
          <input type="text" id="first_name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
        <div>
          <label class="block text-sm font-medium text-darkgray mb-1">Last Name</label>
          <input type="text" id="last_name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-darkgray mb-1">Email Address</label>
        <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
      </div>
      <div>
        <label class="block text-sm font-medium text-darkgray mb-1">Phone</label>
        <input type="text" id="phone" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
      </div>
      <div>
        <label class="block text-sm font-medium text-darkgray mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
      </div>
      <div>
        <label class="block text-sm font-medium text-darkgray mb-1">Role</label>
        <select id="role" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
          <option value="Student">Student</option>
          <option value="Teacher">Teacher</option>
          <option value="Accounting">Accounting</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-primary-dark transition">Register</button>
    </form>
    <div class="mt-4 text-center text-sm">
      <p class="text-gray-600">Already have an account? <a href="index.html" class="text-secondary font-medium hover:underline">Login</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
