<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | School Management</title>
  <link href="/css/output.css" rel="stylesheet">
</head>
<body class="min-h-screen grid place-items-center p-6">
  <main class="w-full max-w-md rounded-xl bg-white p-8 shadow">
    <h1 class="text-2xl font-bold">Create a student account</h1>
    <form id="register-form" class="mt-6 space-y-4">
      <label class="block">First name<input class="mt-1 w-full rounded border p-2" name="first_name" required></label>
      <label class="block">Last name<input class="mt-1 w-full rounded border p-2" name="last_name" required></label>
      <label class="block">Email<input class="mt-1 w-full rounded border p-2" name="email" type="email" required></label>
      <label class="block">Password (at least 8 characters)<input class="mt-1 w-full rounded border p-2" name="password" type="password" minlength="8" required></label>
      <p class="text-sm text-red-700" data-message role="alert"></p>
      <button class="w-full rounded bg-blue-700 p-2 text-white" type="submit">Register</button>
    </form>
    <p class="mt-4 text-sm"><a class="text-blue-700 underline" href="/">Back to sign in</a></p>
  </main>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body>
</html>
