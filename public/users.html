<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users Management - School Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-50">
  <div id="app" class="flex min-h-screen">
    <!-- Layout rendered dynamically by layout.js -->
    <div class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-heading">Users Management</h3>
        <button id="open-add-modal" class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:bg-primary-dark transition">Add New User</button>
      </div>

      <!-- Filters -->
      <div class="bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-wrap gap-4 items-center">
        <input type="text" id="search-input" placeholder="Search by name, username..." class="px-3 py-2 border rounded-lg text-sm w-64 focus:outline-none focus:ring-2 focus:ring-primary">
        <select id="role-filter" class="px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
          <option value="">All Roles</option>
          <option value="Admin">Admin</option>
          <option value="Teacher">Teacher</option>
          <option value="Student">Student</option>
          <option value="Accounting">Accounting</option>
        </select>
        <select id="status-filter" class="px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="suspended">Suspended</option>
        </select>
        <button id="filter-btn" class="bg-secondary text-white px-4 py-2 rounded-lg text-sm hover:bg-secondary-dark transition">Filter</button>
      </div>

      <!-- Users Table -->
      <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-darkgray uppercase text-xs tracking-wider border-b">
              <th class="p-3">Username</th>
              <th class="p-3">Name</th>
              <th class="p-3">Email / Phone</th>
              <th class="p-3">Role</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body" class="divide-y divide-gray-200 text-sm">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="user-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
      <h3 id="modal-title" class="text-lg font-bold mb-4">Add User</h3>
      <form id="user-form" class="space-y-4">
        <input type="hidden" id="user-id">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-darkgray mb-1">Username</label>
            <input type="text" id="form-username" required class="w-full px-3 py-2 border rounded text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-darkgray mb-1">Role</label>
            <select id="form-role" class="w-full px-3 py-2 border rounded text-sm">
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
              <option value="Accounting">Accounting</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-darkgray mb-1">First Name</label>
            <input type="text" id="form-first-name" required class="w-full px-3 py-2 border rounded text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-darkgray mb-1">Last Name</label>
            <input type="text" id="form-last-name" required class="w-full px-3 py-2 border rounded text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-darkgray mb-1">Email</label>
            <input type="email" id="form-email" class="w-full px-3 py-2 border rounded text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-darkgray mb-1">Phone</label>
            <input type="text" id="form-phone" class="w-full px-3 py-2 border rounded text-sm">
          </div>
        </div>
        <div id="password-field-wrapper">
          <label class="block text-xs font-medium text-darkgray mb-1">Password</label>
          <input type="password" id="form-password" class="w-full px-3 py-2 border rounded text-sm">
        </div>
        <div class="flex justify-end space-x-2 pt-4">
          <button type="button" id="close-modal" class="px-4 py-2 bg-gray-300 text-darkgray rounded text-sm hover:bg-gray-400">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-primary text-white rounded text-sm hover:bg-primary-dark">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
